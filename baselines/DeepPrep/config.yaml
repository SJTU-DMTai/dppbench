# Use the released DeepPrep checkpoint directly.
llm_backend: local
llm_model: /mnt/sdb/dengjiale/dppbench/llm_ckpt/DeepPrep-Qwen3-8B
# api_key (default: null): Loaded from project apikeys.json; keep null.
api_key: null
# base_url (default: null): Loaded from project apikeys.json; keep null.
base_url: null
# Paper inference setting.
temperature: 0.01
top_p: 1.0
# max_tokens (default: 2048): Maximum tokens per LLM response.
max_tokens: 2048
# timeout (default: 600): LLM request timeout in seconds.
timeout: 600
# Hugging Face checkpoint loading settings.
torch_dtype: bfloat16
device_map: auto
# Maximum tree-agent exploration turns, including error correction and answer.
max_explore_turn: 6
# max_chain_len (default: 6): Maximum operator chain length.
max_chain_len: 6
# max_depth (default: 8): Maximum search tree depth.
max_depth: 8
# max_err_cnt (default: 5): Cumulative agent error budget.
max_err_cnt: 5
# small_n (default: 0): Sandbox row subsample size; 0 disables.
small_n: 0
# eval_full (default: true): Re-evaluate the best pipeline on full data.
eval_full: true
# DPPBench adaptation: sampled validation AUC feedback, fixed training parameters.
# Disable downstream_feedback to restore schema-only inference.
downstream_feedback: true
downstream_eval_n: 10000
max_solution_attempts: 1
# seed (default: 42): Random seed for agent and evaluation.
seed: 42
# fast_train (default: true): Enable search-time fast training overrides.
fast_train: true
