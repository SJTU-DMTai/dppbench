dag:
  sources:
  - id: s0
    table: main
  - id: s1
    table: monthly_history
  ops:
  - id: o1
    op: JoinTable
    prev: [s0, s1]
    params:
      method: key
      aux_df: $monthly_history
      key_col: ID
  - id: o2
    op: LabelEncode
    prev: [o1]
  - id: o3
    op: HandleMV
    prev: [o2]
    params:
      method: median
  train:
    prev: [o3]
