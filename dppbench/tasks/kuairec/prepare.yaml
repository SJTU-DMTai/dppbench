dag:
  sources:
  - id: s0
    table: interaction
  - id: s1
    table: item
  ops:
  - id: o1
    op: JoinTable
    prev: [s0, s1]
    params:
      user_col: user_id
      item_col: item_id
      how: left
      method: rec
  - id: o2
    op: FilterSample
    prev: [o1]
    params:
      subset: [user_id, item_id, watch_ratio]
  - id: o3
    op: CreateSequence
    prev: [o2]
    params:
      user_col: user_id
      item_col: item_id
      time_col: timestamp
      seq_col: item_id_seq
      max_len: 20
  - id: o4
    op: SampleNegative
    prev: [o3]
    params:
      user_col: user_id
      item_col: item_id
      target_col: watch_ratio
      n_negatives: 1
      positive_label: 1
      negative_label: 0
      seed: 42
  train:
    prev: [o4]
