small_n: 3000  # Total search train+validation rows; 0 disables. Final HPO/test stays full.
# Released README's daghie variant, not a claimed paper reimplementation.
operator_space: typed_public_v4
# DAGPipe fits numeric nodes on a fixed seeded sample of up to 16 legal training rows.
target_encoding_folds: 5
epochs: 200
batch_size: 256
learning_rate: 0.01
lambda_dag: 0.1
lambda_sparse: 0.0001
patience: 20
# Same proxy architectures as DiffPrep; DAGPipe keeps joint Adam optimization.
surrogate_hidden_dim: 32
rec_emb_dim: 16
# Original RobustScaler can overflow float32 gradients on tied categorical values.
dtype: float64
transform_cache_entries: 3
# Per frozen model/device; bounds RETAINED outputs, not all process memory.
transform_cache_max_mb: 512
# Preserve previous stopping semantics unless explicitly testing another budget.
min_delta: 0.0
data_placement: auto
gpu_reserve_mb: 4096
gpu_data_fraction: 0.5
transform_batch_size: 1024
# A short profiling run is diagnostic; exclude it from benchmark timings.
profile_steps: 0
diagnostic_steps: 0
# Resource enforcement remains cooperative; full checks at phase boundaries.
resource_check_interval_s: 0.1
sync_mode: optimized
# Task contract documented in dppbench/tasks/TASKS_SUMMARY.md: cnt=casual+registered.
exclude_columns:
  bike_sharing: [casual, registered]
