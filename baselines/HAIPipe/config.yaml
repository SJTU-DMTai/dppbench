# HAIPipe trains a fresh policy and candidate scorer for each task/model run.
max_pipeline_len: 8
small_n: 3000
eval_full: true
seed: 42
fast_train: true
hi_source: prepare_yaml

# AIPipe defaults, used by both the baseline runner and optional pretraining CLI.
learning_rate: 0.00001
# Upstream learning() bootstraps with coefficient 1 despite config.gamma=0.
gamma: 1.0
buffer_capacity: 2000
batch_size: 100
logic_batch_size: 20
epsilon_start: 1.0
epsilon_end: 0.4
epsilon_decay: 500
train_interval: 100
# Match the paper/released policy training count for each task/model run.
frames: 56000

# Upstream alternative-evaluator pretraining defaults.
al_epochs: 10
al_learning_rate: 0.01
al_batch_size: 16

# Original active-learning budget (K=20, T=7).
al_k: 20
al_iterations: 7
