# Released README's daghie variant, not a claimed paper reimplementation.
epochs: 200
batch_size: 256
learning_rate: 0.01
lambda_dag: 0.1
lambda_sparse: 0.0001
patience: 20
hidden: 64
reference_rows: 16
# Original RobustScaler can overflow float32 gradients on tied categorical values.
dtype: float64
transform_cache_entries: 2
# Task contract documented in dppbench/tasks/TASKS_SUMMARY.md: cnt=casual+registered.
exclude_columns:
  bike_sharing: [casual, registered]
