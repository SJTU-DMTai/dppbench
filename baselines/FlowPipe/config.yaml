# Three training modes; missing pretrained weights are an explicit error.
training_mode: finetune
pretrained_dir: checkpoints/pretrained
pretrained_checkpoint: null
finetune_frames: 2000
finetune_epochs: 2
finetune_eps_start: 0.2
finetune_eps_end: 0.05
# Scratch budgets; default deployment loads shared source weights.
checkpoint_path: null
train_epochs: 20
trajectories_per_epoch: 8
updates_per_epoch: 1
trajectory_batch_size: 16
context_cache_dir: /mnt/sdb/dengjiale/dppbench/output/FlowPipe/context_embeddings
llama_model_path: /mnt/sdb/dengjiale/dppbench/llm_ckpt/Qwen3-8B
llm_name: Qwen3-8B
ctx_dim: 4096
hidden_dim: 512
learning_rate: 0.0005
buffer_capacity: 80000
failure_weight: 0.2
reward_temperature: 2.0
inference_samples: 3
inference_mode: sample
inference_top_n: 3
# DPPBench has four shared operator categories; the logic action is separate.
max_steps: 4
small_n: 0
eval_full: true
seed: 42
fast_train: true
