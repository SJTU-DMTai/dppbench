# n_epochs (official default: 2000): Number of bilevel optimization epochs.
n_epochs: 2000
# small_n (default: 3000): Search-time row subsample size; 0 disables.
small_n: 3000
# lr_w (default: 0.01): Inner-loop surrogate weight learning rate.
lr_w: 0.01
# lr_alpha (official default follows lr_w): Outer-loop architecture learning rate.
lr_alpha: 0.01
# eps_finite_diff (default: 0.001): Finite-difference epsilon for second order.
eps_finite_diff: 0.001
# flex (default: false): Enable DiffPrep-Flex operator order learning.
flex: false
# eval_full (default: true): Re-evaluate the best pipeline on full data.
max_pipeline_len: null
eval_full: true
# max_features (null): Use all features, as in the official implementation.
max_features: null
# batch_size (official default: 512): Surrogate training minibatch size.
batch_size: 512
# val_ratio (official default: 0.2): Validation split ratio.
val_ratio: 0.2
# continuous_init_scale (default: 0.001): Initial scale for architecture logits.
continuous_init_scale: 0.001
# second_order: official DiffPrep always applies the finite-difference HVP.
second_order: true
# sgd_momentum (default: 0.9): Momentum for surrogate weight SGD.
sgd_momentum: 0.9
# surrogate_hidden_dim: retained only for the DPPBench recommendation extension.
surrogate_hidden_dim: 32
# rec_emb_dim (default: 16): User/item embedding dimension for rec surrogate.
rec_emb_dim: 16
# gumbel_tau (official temperature: 0.1).
gumbel_tau: 0.1
# hard_sample: official default uses probabilities rather than hard sampling.
hard_sample: false
# seed (default: 42): Random seed for training and discretization.
seed: 42
# Enabled Berka experiment adapter. Unlisted datasets retain legacy seeded draws.
# Set join_overrides: {} to restore the legacy strategy for every dataset.
join_overrides:
  berka:
    table: order
    key_col: account_id
    method: agg
    prefix: null
    max_cols: null
