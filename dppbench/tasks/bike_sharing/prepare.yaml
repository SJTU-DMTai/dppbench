dag:
  sources:
  - id: s0
    table: main
  - id: s1
    table: day
  ops:
  - id: o1
    op: JoinTable
    prev: [s0, s1]
    params:
      method: key
      aux_df: $day
      key_col: dteday
  - id: o2
    op: DropColumns
    prev: [o1]
    params:
      cols: [casual, registered]
  - id: o3
    op: LabelEncode
    prev: [o2]
  - id: o4
    op: HandleMV
    prev: [o3]
    params:
      method: median
  train:
    prev: [o4]
