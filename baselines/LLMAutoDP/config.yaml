llm_backend: local
llm_model: /mnt/sdb/dengjiale/dppbench/llm_ckpt/Qwen3-8B
# Method-specific sampling; BAT and DeepPrep also use different temperatures.
temperature: 0.6
top_p: 1.0
# Match the shared local loading defaults and disable Qwen thinking.
