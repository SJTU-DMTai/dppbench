# Three training modes; missing pretrained weights are an explicit error.
training_mode: finetune
pretrained_dir: checkpoints/pretrained
pretrained_checkpoint: null
finetune_frames: 2000
finetune_epochs: 2
finetune_eps_start: 0.2
finetune_eps_end: 0.05
# Scratch budgets; finetune and frozen deployment load shared source weights.
max_pipeline_len: 8
small_n: 3000
eval_full: true
seed: 42
fast_train: true
hi_source: prepare_yaml

# AIPipe defaults, used by both the baseline runner and optional pretraining CLI.
learning_rate: 0.00001
# Upstream learning() bootstraps with coefficient 1 despite config.gamma=0.
gamma: 1.0
buffer_capacity: 2000
batch_size: 100
logic_batch_size: 20
epsilon_start: 1.0
epsilon_end: 0.4
epsilon_decay: 500
train_interval: 100
# Full scratch/source policy interaction budget.
frames: 56000

# Upstream alternative-evaluator pretraining defaults.
al_epochs: 10
al_learning_rate: 0.01
al_batch_size: 16

# Original active-learning budget (K=20, T=7).
al_k: 20
al_iterations: 7
