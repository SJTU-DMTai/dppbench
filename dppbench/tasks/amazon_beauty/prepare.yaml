dag:
  sources:
  - id: s0
    table: interaction
  - id: s1
    table: item
  ops:
  - id: o1
    op: Deduplicate
    prev: [s1]
    params:
      subset: [item_id]
      keep: first
  - id: o2
    op: JoinTable
    prev: [s0, o1]
    params:
      user_col: user_id
      item_col: item_id
      how: left
      method: rec
  - id: o3
    op: HandleMV
    prev: [o2]
    params:
      cols: [item_brand]
      method: constant
      fill_value: 0
      action: impute
  - id: o4
    op: FilterSample
    prev: [o3]
    params:
      subset: [user_id, item_id, rating]
  - id: o5
    op: CreateSequence
    prev: [o4]
    params:
      user_col: user_id
      item_col: item_id
      time_col: timestamp
      seq_col: item_id_seq
      max_len: 20
  - id: o6
    op: CreateSequence
    prev: [o5]
    params:
      user_col: user_id
      item_col: item_brand
      time_col: timestamp
      seq_col: cate_id_seq
      max_len: 20
  - id: o7
    op: SampleNegative
    prev: [o6]
    params:
      user_col: user_id
      item_col: item_id
      target_col: rating
      n_negatives: 1
      positive_label: 1
      negative_label: 0
      seed: 42
  train:
    prev: [o7]
