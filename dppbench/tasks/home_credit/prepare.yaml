dag:
  sources:
  - id: s0
    table: main
  - id: s1
    table: bureau
  ops:
  - id: o1
    op: JoinTable
    prev: [s0, s1]
    params:
      method: agg
      aux_df: $bureau
      key_col: SK_ID_CURR
  - id: o2
    op: LabelEncode
    prev: [o1]
  - id: o3
    op: HandleMV
    prev: [o2]
    params:
      method: median
  train:
    prev: [o3]
