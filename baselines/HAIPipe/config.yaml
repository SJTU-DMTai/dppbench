# HAIPipe uses task prepare.yaml as HI and frozen cross-task checkpoints.
max_pipeline_len: 8
small_n: 3000
eval_full: true
seed: 42
fast_train: true
hi_source: prepare_yaml

# Original AIPipe defaults, used by the separate cross-task pretrainer.
learning_rate: 0.00001
gamma: 0.0
buffer_capacity: 2000
batch_size: 100
epsilon_start: 1.0
epsilon_end: 0.4
epsilon_decay: 500
train_interval: 100
frames: 100000

# Original active-learning budget (K=20, T=7).
al_k: 20
al_iterations: 7
aipipe_checkpoint: checkpoints/aipipe.pt
al_checkpoint: checkpoints/alternative_evaluator.pt
